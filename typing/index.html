<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6ec">
  <title>윙글 타자연습</title>
  <script type="module" crossorigin src="/typing/assets/index-BAGI5_RV.js"></script>
  <link rel="stylesheet" crossorigin href="/typing/assets/index-DE29BeYV.css">
</head>
<body>
  <header class="bar"><div class="brand"><span class="brand-mark" aria-hidden="true">⌨</span> 윙글 타자연습</div><span class="bar-label">한글 두벌식</span></header>
  <main>
    <nav id="stages" aria-label="연습 단계"></nav>
    <section class="practice" aria-label="타자 연습">
      <div class="exercise">
        <div class="lesson"><h1 id="lesson"></h1><span id="count"></span></div>
        <div class="progress">
          <div id="progress-bar" class="progress-track" role="progressbar" aria-label="연습 진행도" aria-valuemin="0">
            <div class="progress-fill"></div>
            <span class="progress-paw" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <span id="progress-count" aria-hidden="true"></span>
        </div>
        <div id="practice-content">
          <p id="prompt-label"></p>
          <div id="target"></div>
          <form id="word-form" hidden>
            <input id="word" aria-label="단어 입력" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button type="submit">확인</button>
          </form>
          <p id="hint"></p>
          <button id="start" type="button">자리 연습 시작</button>
        </div>
        <div id="result" hidden>
          <h2 tabindex="-1">연습을 마쳤어요!</h2>
          <div id="scores"></div>
          <button id="retry" class="secondary" type="button">다시 연습</button>
          <button id="next" type="button"></button>
        </div>
      </div>
      <aside class="companion" aria-label="고양이 응원">
        <div id="cat" class="cat" data-mood="idle" aria-hidden="true">
          <div class="tail"></div><div class="body"></div>
          <div class="head"><i class="ear left"></i><i class="ear right"></i><div class="face">
            <i class="stripe"></i><i class="eye left"></i><i class="eye right"></i><i class="blush left"></i><i class="blush right"></i><i class="nose"></i><i class="mouth"></i>
          </div></div><i class="paw left"></i><i class="paw right"></i>
        </div>
        <p id="message" role="status"></p>
      </aside>
    </section>
    <section id="keyboard-panel" class="keyboard-panel" aria-label="두벌식 자판 안내">
      <div class="keyboard-label"><span>키보드</span><span id="keyboard-status"></span></div>
      <div id="keyboard" aria-hidden="true"><canvas id="hands"></canvas></div>
    </section>
  </main>
</body>
</html>
