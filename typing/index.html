<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6ec">
  <title>윙글 타자연습</title>
  <script type="module" crossorigin src="/typing/assets/index-6b0HGehA.js"></script>
  <link rel="stylesheet" crossorigin href="/typing/assets/index-B_cotDdM.css">
</head>
<body>
  <header class="bar"><div class="brand"><span class="brand-mark" aria-hidden="true">⌨</span> 윙글 타자연습</div><div class="bar-links"><span class="bar-label">한글 두벌식</span><a class="studio-banner" href="https://wingul.duckdns.org/#lineup">윙글 스튜디오</a></div></header>
  <main>
    <nav id="stages" aria-label="연습 단계"></nav>
    <section class="practice" aria-label="타자 연습">
      <div class="exercise">
        <div class="lesson"><h1 id="lesson"></h1><span id="count"></span></div>
        <div class="progress">
          <div id="progress-bar" class="progress-track" role="progressbar" aria-label="연습 진행도" aria-valuemin="0">
            <div class="progress-fill"></div>
            <span class="progress-paw" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <span id="progress-count" aria-hidden="true"></span>
        </div>
        <div id="practice-content">
          <p id="prompt-label"></p>
          <div id="target"></div>
          <form id="word-form" hidden>
            <input id="word" aria-label="단어 입력" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button type="submit">확인</button>
          </form>
          <p id="hint"></p>
          <div class="practice-actions">
            <button id="start" type="button">자리 연습 시작</button>
            <button id="open-words" class="secondary" type="button">단어 연습 바로가기</button>
          </div>
        </div>
        <div id="result" hidden>
          <h2 tabindex="-1">연습을 마쳤어요!</h2>
          <div id="scores"></div>
          <button id="retry" class="secondary" type="button">다시 연습</button>
          <button id="next" type="button"></button>
        </div>
      </div>
      <aside class="companion" aria-label="강아지 응원">
        <div id="cat" class="cat" data-mood="idle" aria-hidden="true"></div>
        <p id="message" role="status"></p>
      </aside>
    </section>
    <section id="keyboard-panel" class="keyboard-panel" aria-label="두벌식 자판 안내">
      <input id="position-input" aria-label="자리 연습 키 입력" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1" hidden>
      <div class="keyboard-label"><span>키보드</span><span id="keyboard-status"></span></div>
      <div id="keyboard" aria-hidden="true"><canvas id="hands"></canvas></div>
    </section>
  </main>
  <footer class="studio-footer">
    <small>© 윙글 스튜디오</small>
    <a href="https://wingul.duckdns.org/#lineup">윙글 스튜디오 구경하기</a>
  </footer>
</body>
</html>
