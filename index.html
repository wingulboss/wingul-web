<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="윙글 스튜디오의 안드로이드 앱, 윙글 키보드와 투두 매트릭스를 소개합니다.">
<title>윙글 스튜디오 | WINGUL XTUDIO</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; color: #eaeef6; background: #10141e; font: 16px/1.6 "Malgun Gothic", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 4px; }
  a:focus-visible { outline: 2px solid #a6d5ff; outline-offset: 5px; }
  .wrap { width: min(1180px, calc(100% - 80px)); margin: auto; }
  header { border-bottom: 1px solid #313a4a; }
  header .wrap, footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  header .wrap { min-height: 72px; }
  .brand { font: 800 16px/1.2 system-ui, sans-serif; letter-spacing: .13em; white-space: nowrap; }
  nav { display: flex; gap: 28px; color: #c6cfdd; font-size: 13px; }
  .hero { background: radial-gradient(ellipse at 50% 20%, #202f52, transparent 68%); border-bottom: 1px solid #313a4a; }
  .hero .wrap { display: grid; justify-items: center; gap: 22px; padding-block: 48px; text-align: center; }
  h1 { margin: 0; width: min(100%, 280px); }
  .studio-logo { display: block; width: 100%; height: auto; }
  h2, h3, p { margin: 0; }
  .intro h2 { font-size: clamp(24px, 3vw, 39px); letter-spacing: -.08em; }
  .intro p { margin-top: 8px; color: #b9c5d8; }
  .button { display: inline-block; margin-top: 22px; color: #112037; background: #afdaff; padding: 11px 18px; border-radius: 6px; font-weight: 700; font-size: 14px; }
  section { scroll-margin-top: 20px; }
  .lineup { padding-block: 44px 48px; }
  .lineup > h2 { font-size: 29px; letter-spacing: -.06em; margin-bottom: 18px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  article { overflow: hidden; border: 1px solid #333e52; border-radius: 14px; background: #171e2c; }
  .visual { display: grid; place-items: center; min-height: 218px; padding: 25px 18px; overflow: hidden; }
  .keyboard { background: radial-gradient(ellipse at center, #4386c3, #142c53 75%); }
  .matrix { background: radial-gradient(ellipse at center, #53698e, #252842 75%); }
  .app-icon { display: block; width: 130px; height: 130px; border-radius: 24px; box-shadow: 0 17px 32px #0a132b90; }
  .copy { padding: 20px 24px 23px; }
  .copy h3 { font-size: 24px; letter-spacing: -.055em; }
  .copy p { margin: 5px 0 16px; color: #c4cede; font-size: 14px; }
  .card-links a { font-weight: 700; color: #afdaff; }
  .copy { display: flex; flex-direction: column; flex: 1; }
  article { position: relative; display: flex; flex-direction: column; }
  .product-link::after { content: ""; position: absolute; inset: 0; }
  article:focus-within { outline: 2px solid #a6d5ff; outline-offset: 3px; }
  @media (hover: hover) {
    article:hover { transform: translateY(-3px); border-color: #7195c5; box-shadow: 0 10px 24px #080d1780; }
  }
  @media (prefers-reduced-motion: no-preference) {
    article { transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    article:hover { transform: none; }
  }
  .card-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; border-top: 1px solid #333e52; margin-top: auto; padding-top: 12px; font-size: 13px; }
  .card-links a { position: relative; }
  footer { border-top: 1px solid #313a4a; }
  footer .wrap { min-height: 70px; color: #aab7ca; }
  footer small { font-size: 13px; }
  @media (max-width: 680px) {
    .wrap { width: calc(100% - 36px); }
    header .wrap { min-height: 60px; gap: 12px; }
    .brand { font-size: 12px; }
    nav { gap: 12px; font-size: 11px; }
    .hero .wrap { gap: 17px; padding-block: 32px; }
    .hero h1 { width: min(100%, 210px); }
    .intro p { font-size: 14px; }
    .button { margin-top: 17px; }
    .cards { grid-template-columns: 1fr; }
    .lineup { padding-block: 30px; }
    .visual { min-height: 177px; }
  }
</style>
</head>
<body id="top">
<header>
  <div class="wrap">
    <a class="brand" href="#top">WINGUL XTUDIO</a>
    <nav aria-label="주 메뉴">
      <a href="#lineup">제품 라인업</a>
    </nav>
  </div>
</header>
<main>
  <section class="hero" aria-labelledby="studio">
    <div class="wrap">
      <h1 id="studio">
        <svg class="studio-logo" viewBox="95 208 1067 806" role="img" aria-label="WINGUL XTUDIO">
          <image href="assets/studio-logo.png" width="1254" height="1254"/>
        </svg>
      </h1>
      <div class="intro">
        <div>
          <h2>내 일상에 맞는 도구</h2>
          <p>매일 하는 일을 내 방식대로, 조금 더 편하게.</p>
        </div>
        <a class="button" href="#lineup">제품 둘러보기 ↓</a>
      </div>
    </div>
  </section>
  <section class="wrap lineup" id="lineup">
    <h2>제품 라인업</h2>
    <div class="cards">
      <article>
        <div class="visual keyboard" aria-hidden="true">
          <img class="app-icon" src="wingul-logo.png" alt="">
        </div>
        <div class="copy">
          <h3><a class="product-link" href="keyboard/">윙글 키보드</a></h3>
          <p>다양한 한글 배열과 커스텀 키로 내 손에 맞는 입력 환경을 만드세요.</p>
          <div class="card-links">
            <a href="privacy/" aria-label="윙글 키보드 개인정보처리방침">개인정보처리방침 ↗</a>
          </div>
        </div>
      </article>
      <article>
        <div class="visual matrix" aria-hidden="true">
          <img class="app-icon" src="assets/todomatrix-icon.svg" alt="">
        </div>
        <div class="copy">
          <h3><a class="product-link" href="todomatrix/">투두매트릭스</a></h3>
          <p>할일을 중요도와 긴급도로 나누고, 루틴과 일정을 함께 관리하세요.</p>
          <div class="card-links">
            <a href="todomatrix/privacy/" aria-label="투두 매트릭스 개인정보처리방침">개인정보처리방침 ↗</a>
          </div>
        </div>
      </article>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <a class="brand" href="#top">WINGUL XTUDIO</a>
    <small>윙글 스튜디오</small>
  </div>
</footer>
</body>
</html>
